scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['api-gateway:8811']
        labels:
          application: 'api-gateway'

  - job_name: 'kafka'
    static_configs:
      - targets: [ 'kafka:9092' ]
        labels:
          application: 'kafka'
    scrape_interval: 10s