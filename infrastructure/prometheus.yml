          application: 'vocabulary-command-service'

  - job_name: 'vocabulary-read-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['vocabulary-read-service:8813']
        labels:
          application: 'vocabulary-read-service'

  - job_name: 'deck-service'
    metrics_path: '/actuator/prometheus'
