scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['api-gateway:8811']
        labels:
          application: 'api-gateway'

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka_exporter:9308']
        labels:
          application: 'kafka-exporter'
    scrape_interval: 10s