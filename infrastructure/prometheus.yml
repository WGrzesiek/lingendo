scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    static_configs:
#      - targets: ['learnwords-api-gateway-1:8811']
      - targets: ['api-gateway:8811']
        labels:
          application: 'api-gateway'
  - job_name: 'api-gateway1'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    static_configs:
      - targets: ['learnwords-api-gateway-1:8811']
        labels:
          application: 'api-gateway1'

  - job_name: 'kafka'
    static_configs:
      - targets: [ 'kafka:9092' ]
        labels:
          application: 'kafka'
    scrape_interval: 3s