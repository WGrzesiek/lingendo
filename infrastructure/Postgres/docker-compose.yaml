services:
  postgres:
    image: postgres:15
    container_name: LearnWorldsOutbox
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      shared_network:
        ipv4_address: 192.168.23.13

  pgadmin:
    image: dpage/pgadmin4
    container_name: LearnWorldsOutboxAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  shared_network:
    external: true
