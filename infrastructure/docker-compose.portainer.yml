name: learnwords
services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.35.0
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - 9443:9443
      - 8000:8000  # Remove if you do not intend to use Edge Agents
    networks: [learnwords-net]
volumes:
  portainer_data:
    name: portainer_data

networks:
  learnwords-net:
    external: true