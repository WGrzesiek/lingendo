spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:192.168.23.9}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: koog-service
              uri: http://koog-service:7777
              predicates:
                - Path=/openapi/koog-api
              filters:
                - SetPath=/api-docs
            - id: api-gateway-service
              uri: http://api-gateway:8811
              predicates:
                - Path=/openapi/api-gateway-service
              filters:
                - SetPath=/v3/api-docs
            - id: user-service
              uri: http://user-service:8812
              predicates:
                - Path=/openapi/user-service
              filters:
                - SetPath=/api-docs
            - id: vocabulary-command-service
              uri: http://vocabulary-command-service:8810
              predicates:
                - Path=/openapi/vocabulary-command-service
              filters:
                - SetPath=/api-docs
            - id: vocabulary-read-service
              uri: http://vocabulary-read-service:8813
              predicates:
                - Path=/openapi/vocabulary-read-service
              filters:
                - SetPath=/api-docs
            - id: deck-service
              uri: http://deck-service:8814
              predicates:
                - Path=/openapi/deck-service
              filters:
                - SetPath=/api-docs
            - id: koog-api
              uri: http://koog-service:7777
              predicates:
                - Path=/api/v1/sentences/**
            - id: deck-api
              uri: http://deck-service:8814
              predicates:
                - Path=/api/v1/decks/**,/api/v1/sessions/**,/api/v1/flashcards/**,/api/v1/enrollments/**, /api/v1/decks-share/**
              filters:
                - RemoveRequestHeader=X-User-Id
                - RemoveRequestHeader=X-Client-Id
                - RemoveRequestHeader=X-Roles
            - id: user-api
              uri: http://user-service:8812
              predicates:
                - Path=/api/v1/users/**, /api/v1/groups/**, /api/v1/teacher-student/**, /api/v1/friends/**,
            - id: vocabulary-command-api
              uri: http://vocabulary-command-service:8810
              predicates:
                - Path=/api/v1/vocabulary/**,/api/v1/sentences/**
            - id: vocabulary-read-api
              uri: http://vocabulary-read-service:8813
              predicates:
                - Path=/api/v1/read/vocabulary/**,/api/v1/read/sentences/**
            - id: statistics-api
              uri: http://statistics-service:8799
              predicates:
                - Path=/api/v1/dashboard/**,/api/v1/courses/**, /api/v1/stats/**, /api/v1/stats/friends/**, /api/v1/dashboard/teacher/**, /api/v1/stats/groups/**
              filters:
                - RemoveRequestHeader=X-User-Id
                - RemoveRequestHeader=X-Client-Id
                - RemoveRequestHeader=X-Roles
            - id: statistics-service
              uri: http://statistics-service:8799
              predicates:
                - Path=/openapi/statistics-service
              filters:
                - SetPath=/api-docs
server:
  error:
    # Nie wystawiaj wewnętrznych szczegółów błędu klientowi (leak Redis endpoint/hasło w trace itp.).
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  port: ${SERVER_PORT:8811}

logging:
  level:
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.springframework.http.converter: ${LOG_LEVEL_HTTP_CONVERTER:INFO}

springdoc:
  swagger-ui:
    path: /api-docs
    urls:
      - name: api-gateway-service
        url: /openapi/api-gateway-service
      - name: user-service
        url: /openapi/user-service
      - name: vocabulary-command-service
        url: /openapi/vocabulary-command-service
      - name: vocabulary-read-service
        url: /openapi/vocabulary-read-service
      - name: deck-service
        url: /openapi/deck-service
      - name: statistics-service
        url: /openapi/statistics-service
      - name: koog-api
        url: /openapi/koog-api
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1

jwt:
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:./secrets/private_key.pem}
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/public_key.pem}
  expire-in: ${JWT_EXPIRE_IN:86400000}

grpc:
  client:
    auth:
      address: ${GRPC_CLIENT_AUTH_ADDRESS:static://192.168.23.9:9098}
      negotiationType: ${GRPC_CLIENT_AUTH_NEGOTIATIONTYPE:PLAINTEXT}

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006}
  jwt:
    issuer: ${JWT_ISSUER:learnwords-api}
    kid: ${JWT_KID:gateway-kid}
    access-audience: ${JWT_ACCESS_AUDIENCE:lingendo-api}
    refresh-audience: ${JWT_REFRESH_AUDIENCE:lingendo-refresh}
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
    cookie:
      access-name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}
      refresh-name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: ${JWT_COOKIE_SAME_SITE:Strict}
