pring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # OpenAPI proxy (agregacja swaggerów)
            - id: koog-service
              uri: http://koog-service:7777
              predicates:
                - Path=/openapi/koog-api
              filters:
                - SetPath=/api-docs

            - id: api-gateway-service
              uri: http://api-gateway:8811
              predicates:
                - Path=/openapi/api-gateway-service
              filters:
                - SetPath=/v3/api-docs

            - id: user-service
              uri: http://user-service:8812
              predicates:
                - Path=/openapi/user-service
              filters:
                - SetPath=/api-docs

            - id: vocabulary-command-service
              uri: http://vocabulary-command-service:8810
              predicates:
                - Path=/openapi/vocabulary-command-service
              filters:
                - SetPath=/api-docs

            - id: vocabulary-read-service
              uri: http://vocabulary-read-service:8813
              predicates:
                - Path=/openapi/vocabulary-read-service
              filters:
                - SetPath=/api-docs

            - id: deck-service
              uri: http://deck-service:8814
              predicates:
                - Path=/openapi/deck-service
              filters:
                - SetPath=/api-docs

            - id: statistics-service
              uri: http://statistics-service:8799
              predicates:
                - Path=/openapi/statistics-service
              filters:
                - SetPath=/api-docs

            # API proxy
            - id: koog-api
              uri: http://koog-service:7777
              predicates:
                - Path=/api/v1/sentences/**

            - id: deck-api
              uri: http://deck-service:8814
              predicates:
                - Path=/api/v1/decks/**,/api/v1/sessions/**,/api/v1/flashcards/**,/api/v1/enrollments/**,/api/v1/decks-share/**
              filters:
                - RemoveRequestHeader=X-User-Id
                - RemoveRequestHeader=X-Client-Id
                - RemoveRequestHeader=X-Roles

            - id: user-api
              uri: http://user-service:8812
              predicates:
                - Path=/api/v1/users/**,/api/v1/groups/**,/api/v1/teacher-student/**,/api/v1/friends/**

            - id: vocabulary-command-api
              uri: http://vocabulary-command-service:8810
              predicates:
                - Path=/api/v1/vocabulary/**,/api/v1/sentences/**

            - id: vocabulary-read-api
              uri: http://vocabulary-read-service:8813
              predicates:
                - Path=/api/v1/read/vocabulary/**,/api/v1/read/sentences/**

            - id: statistics-api
              uri: http://statistics-service:8799
              predicates:
                - Path=/api/v1/dashboard/**,/api/v1/courses/**,/api/v1/stats/**,/api/v1/stats/friends/**,/api/v1/dashboard/teacher/**,/api/v1/stats/groups/**
              filters:
                - RemoveRequestHeader=X-User-Id
                - RemoveRequestHeader=X-Client-Id
                - RemoveRequestHeader=X-Roles

          globalcors:
            cors-configurations:
              "[/**]":
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600

springdoc:
  swagger-ui:
    path: /api-docs
    urls:
      - name: api-gateway-service
        url: /openapi/api-gateway-service
      - name: user-service
        url: /openapi/user-service
      - name: vocabulary-command-service
        url: /openapi/vocabulary-command-service
      - name: vocabulary-read-service
        url: /openapi/vocabulary-read-service
      - name: deck-service
        url: /openapi/deck-service
      - name: statistics-service
        url: /openapi/statistics-service
      - name: koog-api
        url: /openapi/koog-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

security:
  jwt:
    issuer: "learnwords-api"
    kid: "gateway-kid"
    access-ttl: 15m
    refresh-ttl: 30d
