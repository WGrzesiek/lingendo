# native-image buildArgs api-gateway (standalone — nie zależy od common, więc własny plik).
# 1) shaded netty (gRPC client net.devh) na init-at-run-time.
# 2) BouncyCastle / nimbus (RSA JWT) init-at-build-time.
# Logowanie wyłączone (slf4j-nop) → brak kaskady logback.
# WebFlux/Spring Cloud Gateway (reactor-netty) — wsparcie native w Spring, bez dodatkowych hintów.
Args = --initialize-at-run-time=io.grpc.netty.shaded \
       --initialize-at-build-time=org.bouncycastle
