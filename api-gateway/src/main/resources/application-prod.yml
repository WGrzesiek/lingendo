spring:
  config:
    activate:
      on-profile: prod

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
          cookie-name: ${ACCESS_TOKEN}

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins: ${CORS_ALLOWED_ORIGINS}

server:
  port: ${SERVER_PORT:8811}

logging:
  level:
    root: INFO
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.springframework.http.converter: ${LOG_LEVEL_HTTP_CONVERTER:INFO}

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}

jwt:
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:/etc/keys/private_key.pem}
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:/etc/keys/public_key.pem}

grpc:
  client:
    auth:
      address: ${GRPC_CLIENT_AUTH_ADDRESS}
      negotiationType: ${GRPC_CLIENT_AUTH_NEGOTIATIONTYPE}

security:
  jwt:
    issuer: api-gateway
    audience: learnwords
    access-ttl: 5m
    refresh-ttl: 30d
    cookie:
      refresh:
        name: refresh
        path: /auth
        same-site: Lax
        secure: true
        http-only: true