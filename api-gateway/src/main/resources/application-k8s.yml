# Profil k8s — api-gateway na k3s (native, low-RAM). Managed Redis (cloud.redis.io) na refresh-token
# store, gRPC client do user-service in-cluster, klucze JWT RSA montowane z Secret. Routes (URIs serwisów)
# dziedziczone z application.yml — nazwy pasują do k8s Service DNS w namespace lingendo.
spring:
  config:
    activate:
      on-profile: k8s

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:default}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        # Required explicitly in the Deployment: Redis endpoints differ in TLS support.
        enabled: ${SPRING_DATA_REDIS_SSL}

# Klucze RSA montowane z Secret `gateway-jwt-keys` do /etc/keys (patrz manifest).
jwt:
  private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:/etc/keys/private_key.pem}
  public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:/etc/keys/public_key.pem}
  expire-in: ${JWT_EXPIRE_IN:86400000}

server:
  port: ${SERVER_PORT:8811}

# gRPC client do user-service (auth) w klastrze.
grpc:
  client:
    auth:
      address: ${GRPC_CLIENT_AUTH_ADDRESS:static://user-service:9098}
      negotiationType: ${GRPC_CLIENT_AUTH_NEGOTIATIONTYPE:PLAINTEXT}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://lingendo.app,https://lingendo.gwawrzen.pl}
  jwt:
    issuer: ${JWT_ISSUER:learnwords-api}
    access-audience: ${JWT_ACCESS_AUDIENCE:lingendo-api}
    refresh-audience: ${JWT_REFRESH_AUDIENCE:lingendo-refresh}
    cookie:
      access-name: ${ACCESS_TOKEN_COOKIE_NAME:__Host-lingendo-access}
      refresh-name: ${REFRESH_TOKEN_COOKIE_NAME:__Host-lingendo-refresh}
      secure: true
      same-site: Strict
