# Native-image buildArgs (czytane automatycznie przez native-image z classpath).
# Shaded netty na init-at-run-time (poprawność: event-loopy nie mogą powstać w build-time
# i zostać zamrożone w obrazie). Logowanie wyłączone (slf4j-nop), więc build-time-init
# logbacka/slf4j/SAX już niepotrzebny — kaskada image-heap zniknęła u źródła.
# Potrzebne w każdym serwisie z gRPC (docelowo można przenieść do proto-shared).
# BouncyCastle (bcpkix, JWT/crypto) standardowo init-at-build-time w native.
Args = --initialize-at-run-time=io.grpc.netty.shaded \
       --initialize-at-build-time=org.bouncycastle
