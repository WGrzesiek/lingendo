# Wspólne native-image buildArgs dla WSZYSTKICH serwisów (common jest zależnością każdego).
# native-image czyta wszystkie META-INF/native-image/**/native-image.properties z classpath.
# Args nieszkodliwe gdy dana biblioteka nieobecna (prefix pakietu po prostu się nie stosuje).
#
# 1) shaded netty (gRPC) na init-at-run-time — event-loopy nie mogą powstać w build-time.
# 2) BouncyCastle (bcpkix, JWT/crypto) standardowo init-at-build-time w native.
# Logowanie wyłączone globalnie (slf4j-nop, logback wykluczony) → brak kaskady logback/SAX/FD.
Args = --initialize-at-run-time=io.grpc.netty.shaded \
       --initialize-at-build-time=org.bouncycastle \
       --initialize-at-build-time=org.slf4j.simple
