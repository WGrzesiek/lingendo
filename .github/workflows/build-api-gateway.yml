name: Build api-gateway
# Wzorzec devPath: native image + push do GHCR. api-gateway standalone → własny Dockerfile.
on:
  push:
    branches: ["main", "deploy/**"]
    paths:
      - "api-gateway/**"
      - "proto-shared/**"
      - "learnwords-parent/**"
      - ".github/workflows/build-api-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/lingendo-api-gateway
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./api-gateway/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
