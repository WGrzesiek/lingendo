name: Build user-service
# Wzorzec devPath: native image + push do GHCR (bez deployu na klaster).
# Adaptacja monorepo: context = ROOT (nie ./user-service), bo Dockerfile.native buduje
# reactor (common + proto-shared + learnwords-parent). Path-filter obejmuje moduły współdzielone.
on:
  push:
    branches: ["main", "deploy/**"]
    paths:
      - "user-service/**"
      - "common/**"
      - "proto-shared/**"
      - "learnwords-parent/**"
      - ".github/workflows/build-user-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/lingendo-user-service
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.native
          build-args: SERVICE=user-service
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
