name: Build vocabulary-read-service
# Wzorzec devPath: native image (wspólny Dockerfile.native, ARG SERVICE) + push do GHCR.
on:
  push:
    branches: ["main"]
    paths:
      - "vocabulary-read-service/**"
      - "common/**"
      - "proto-shared/**"
      - "learnwords-parent/**"
      - "Dockerfile.native"
      - ".github/workflows/build-vocabulary-read-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  vocabulary-read-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/lingendo-vocabulary-read-service
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile.native
          build-args: SERVICE=vocabulary-read-service
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
