name: Build frontend
# Next standalone (node) + push do GHCR. Front woła relatywnie /api → proxy do api-gateway.
on:
  push:
    branches: ["main"]
    paths:
      - "frontend/frontend.git/**"
      - ".github/workflows/build-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/lingendo-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v7.3.0
        with:
          context: ./frontend/frontend.git
          file: ./frontend/frontend.git/Dockerfile.k8s
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
