spring.application.name=vocabulary-read-service
server.port=0002

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=vocabulary-command-service
spring.data.mongodb.username=User
spring.data.mongodb.password=password
spring.jpa.hibernate.ddl-auto= update

spring.kafka.consumer.bootstrap-servers = 127.0.0.1:29092
spring.kafka.consumer.group-id = sentence-service-group
spring.kafka.consumer.auto-offset-reset = earliest
spring.kafka.consumer.key-deserializer = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer = org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class = org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.learnwords.common.dto.SentenceDto

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.bootstrap-servers = 127.0.0.1:9092
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JsonSerializer
