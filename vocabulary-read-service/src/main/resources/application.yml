spring:
  application:
    name: vocabulary-read-service

  data:
    mongodb:
      database: ${DB_MONGODB_NAME:vocabulary-command-service}
      host: ${DB_MONGODB_HOST:localhost}
      username: ${DB_MONGODB_USER:User}
      password: ${DB_MONGODB_PASSWORD:password}
      port: ${DB_MONGODB_PORT:27017}

  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
#      group-id: ${KAFKA_GROUP_ID:learnwords-group}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io:
      debezium: ${LOG_LEVEL_DEBEZIUM:INFO}
      debezium.connector.postgresql: ${LOG_LEVEL_DEBEZIUM_PG:INFO}
    org:
      apache:
        kafka: ${LOG_LEVEL_KAFKA:INFO}
      hibernate: ${LOG_LEVEL_HIBERNATE:INFO}
      postgresql: ${LOG_LEVEL_POSTGRESQL:INFO}
  logstash:
    host: ${LOGSTASH_HOST:localhost}
server:
  port: ${SERVER_PORT:8813}

grpc:
  server:
    port: ${GRPC_PORT:9099}
    address: 0.0.0.0
    reflectionServiceEnabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1