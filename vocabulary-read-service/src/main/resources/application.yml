spring:
  application:
    name: vocabulary-read-service

  data:
    mongodb:
      database: ${DB_MONGODB_NAME:vocabulary-command-service}
      host: ${DB_MONGODB_HOST:localhost}
      username: ${DB_MONGODB_USER:User}
      password: ${DB_MONGODB_PASSWORD:password}
      port: ${DB_MONGODB_PORT:27017}

  kafka:
    consumer:
      auto-offset-reset: earliest
      bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:29092}
      group-id: ${KAFKA_GROUP:sentence-service-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring:
          deserializer:
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JsonDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io:
      debezium: ${LOG_LEVEL_DEBEZIUM:INFO}
      debezium.connector.postgresql: ${LOG_LEVEL_DEBEZIUM_PG:INFO}
    org:
      apache:
        kafka: ${LOG_LEVEL_KAFKA:INFO}
      hibernate: ${LOG_LEVEL_HIBERNATE:INFO}
      postgresql: ${LOG_LEVEL_POSTGRESQL:INFO}
  logstash:
    host: ${LOGSTASH_HOST:localhost}
server:
  port: ${SERVER_PORT:8813}

grpc:
  server:
    port: ${GRPC_PORT:9099}
    address: 0.0.0.0
    reflectionServiceEnabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: false
