spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      host: ${DB_MONGODB_HOST}
      port: ${DB_MONGODB_PORT:27017}
      database: ${DB_MONGODB_NAME}
      username: ${DB_MONGODB_USER}
      password: ${DB_MONGODB_PASSWORD}

  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:latest}
      group-id: ${KAFKA_GROUP:vocabulary-read-service-group}
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  port: ${SERVER_PORT:8813}

grpc:
  server:
    port: ${GRPC_PORT:9099}

logging:
  level:
    root: INFO
    org.apache.kafka: ${LOG_LEVEL_KAFKA:WARN}
  logstash:
    host: ${LOGSTASH_HOST}

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}
