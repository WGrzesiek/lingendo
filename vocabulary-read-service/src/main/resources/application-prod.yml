spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      database: ${DB_MONGODB_NAME}
      host: ${DB_MONGODB_HOST}
      username: ${DB_MONGODB_USER}
      password: ${DB_MONGODB_PASSWORD}
      port: ${DB_MONGODB_PORT}

  # Produkcyjnie unikaj automatycznych migracji JPA
  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP}
      group-id: ${KAFKA_GROUP:vocabulary-read-service-group}

server:
  port: ${SERVER_PORT:8080}

grpc:
  server:
    port: ${GRPC_PORT}
    address: 0.0.0.0
    reflectionServiceEnabled: true

logging:
  level:
    root: INFO
