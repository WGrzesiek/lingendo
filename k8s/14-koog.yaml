# koog-service — AI (Kotlin). Neon Postgres (schema koog), Kafka, OpenAI. RAM limit 384Mi
# (AI framework cięższy; jeśli native niezwalidowany → obraz JVM z koog-service/Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koog-service
  namespace: lingendo
spec:
  replicas: 1
  selector:
    matchLabels: { app: koog-service }
  template:
    metadata:
      labels: { app: koog-service }
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: koog-service
          image: ghcr.io/wgrzesiek/lingendo-koog-service:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 7777 }
          envFrom:
            - configMapRef: { name: lingendo-config }
          env:
            - { name: DATASOURCE_URL, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: DATASOURCE_URL } } }
            - { name: DB_POSTGRESQL_USER, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: DB_POSTGRESQL_USER } } }
            - { name: DB_POSTGRESQL_PASSWORD, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: DB_POSTGRESQL_PASSWORD } } }
            - { name: OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: OPENAI_API_KEY } } }
            - { name: KAFKA_GROUP, value: koog-service-group }
          resources:
            requests: { cpu: "50m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: koog-service
  namespace: lingendo
spec:
  selector: { app: koog-service }
  ports:
    - { name: http, port: 7777, targetPort: http }
