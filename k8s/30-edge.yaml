# Edge: frontend (Next standalone, node) + Ingress (Traefik domyślny w k3s).
# Dynamiczne trasy [id] → nie static export; mały serwer node ~90MB (frontend/frontend.git/Dockerfile.k8s).
# Ingress: "/api" → api-gateway (prod, bezpośrednio), "/" → frontend. next.config rewrites proxuje
# /api → gateway w dev (Vite-style); w prod Ingress łapie /api pierwszy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lingendo
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/wgrzesiek/lingendo-frontend:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3000 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "500m", memory: "160Mi" }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lingendo
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lingendo
  namespace: lingendo
  annotations:
    # Cloudflare przed Traefikiem (SSL/DNS). TLS na k3s przez cert-manager (opcjonalnie).
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  rules:
    # Primary branded domain + legacy domain — both routed to the same backends.
    - host: lingendo.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8811 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
    - host: lingendo.gwawrzen.pl
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8811 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
