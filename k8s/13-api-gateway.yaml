# api-gateway — native, WebFlux + Cloud Gateway. Managed Redis (refresh store), klucze JWT RSA
# montowane z Secret `gateway-jwt-keys` (utwórz: kubectl create secret generic gateway-jwt-keys
#   -n lingendo --from-file=private_key.pem=... --from-file=public_key.pem=...). RAM limit 320Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: lingendo
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api-gateway
          image: ghcr.io/wgrzesiek/lingendo-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8811 }
          envFrom:
            - configMapRef: { name: lingendo-config }
          env:
            - { name: SERVER_PORT, value: "8811" }
            - { name: SPRING_DATA_REDIS_HOST, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: SPRING_DATA_REDIS_HOST } } }
            - { name: SPRING_DATA_REDIS_PORT, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: SPRING_DATA_REDIS_PORT } } }
            - { name: SPRING_DATA_REDIS_USERNAME, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: SPRING_DATA_REDIS_USERNAME } } }
            - { name: SPRING_DATA_REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: SPRING_DATA_REDIS_PASSWORD } } }
            - { name: SPRING_DATA_REDIS_SSL, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: SPRING_DATA_REDIS_SSL } } }
            - { name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI, value: "http://api-gateway.lingendo.svc.cluster.local:8811" }
          resources:
            requests: { cpu: "50m", memory: "160Mi" }
            limits: { cpu: "500m", memory: "320Mi" }
          volumeMounts:
            - { name: jwt-keys, mountPath: /etc/keys, readOnly: true }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
      volumes:
        - name: jwt-keys
          secret:
            secretName: gateway-jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: lingendo
spec:
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 8811, targetPort: http }
