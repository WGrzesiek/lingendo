# Baza klastra: namespace + wspólny ConfigMap. BEZPIECZNE do re-apply (deploy workflow).
# Secret `lingendo-secrets` tworzysz RĘCZNIE poza gitem (szablon: k8s/secret.example.yaml).
# Deploy NIE aplikuje sekretu — inaczej nadpisałby realne wartości placeholderami.
apiVersion: v1
kind: Namespace
metadata:
  name: lingendo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lingendo-config
  namespace: lingendo
data:
  # Szyna zdarzeń in-cluster.
  KAFKA_BOOTSTRAP_SERVERS: "redpanda.lingendo.svc.cluster.local:9092"
  # JWK gateway (weryfikacja JWT w resource-serverach).
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://api-gateway.lingendo.svc.cluster.local:8811/.well-known/jwks.json"
  SPRING_PROFILES_ACTIVE: "k8s"
  LOG_LEVEL_ROOT: "INFO"
  HIBERNATE_DDL_AUTO: "none"
