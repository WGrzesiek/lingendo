# statistics-service — native, Neon Postgres (schema analytics). RAM limit 256Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statistics-service
  namespace: lingendo
spec:
  replicas: 1
  selector:
    matchLabels: { app: statistics-service }
  template:
    metadata:
      labels: { app: statistics-service }
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: statistics-service
          image: ghcr.io/wgrzesiek/lingendo-statistics-service:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8799 }
          envFrom:
            - configMapRef: { name: lingendo-config }
          env:
            - { name: DATASOURCE_URL, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: DATASOURCE_URL } } }
            - { name: DB_POSTGRESQL_USER, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: DB_POSTGRESQL_USER } } }
            - { name: DB_POSTGRESQL_PASSWORD, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: DB_POSTGRESQL_PASSWORD } } }
            - { name: KAFKA_GROUP, value: statistics-service-group }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: statistics-service
  namespace: lingendo
spec:
  selector: { app: statistics-service }
  ports:
    - { name: http, port: 8799, targetPort: http }
