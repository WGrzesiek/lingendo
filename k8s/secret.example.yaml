# SZABLON sekretu — NIE aplikowany przez deploy workflow (miałby placeholdery).
# NIE wpisuj tu REALNYCH wartości (plik jest śledzony w git → wyciek).
# Realny secret twórz komendą (poza gitem). Jeśli chcesz lokalny runbook z wartościami,
# zapisz go jako k8s/secret.local.yaml (gitignored).
#
#   kubectl create secret generic lingendo-secrets -n lingendo \
#     --from-literal=DATASOURCE_URL='jdbc:postgresql://<POOLER-host>/lingendo?sslmode=require' \
#     --from-literal=DB_POSTGRESQL_HOST='<DIRECT-host>' \   # bez -pooler (logical replication)
#     --from-literal=DB_POSTGRESQL_USER='...' --from-literal=DB_POSTGRESQL_PASSWORD='...' \
#     --from-literal=MONGODB_URI='mongodb+srv://.../lingendo?...' \
#     --from-literal=SPRING_DATA_REDIS_HOST='...' --from-literal=SPRING_DATA_REDIS_PORT='...' \
#     --from-literal=SPRING_DATA_REDIS_USERNAME='default' --from-literal=SPRING_DATA_REDIS_PASSWORD='...' \
#     --from-literal=SPRING_DATA_REDIS_SSL='false' \
#     --from-literal=OPENAI_API_KEY='...'
#
#   kubectl create secret generic gateway-jwt-keys -n lingendo \
#     --from-file=private_key.pem=./private_key.pem --from-file=public_key.pem=./public_key.pem
apiVersion: v1
kind: Secret
metadata:
  name: lingendo-secrets
  namespace: lingendo
type: Opaque
stringData:
  DATASOURCE_URL: "jdbc:postgresql://REPLACE_ME.neon.tech/lingendo?sslmode=require"
  DB_POSTGRESQL_HOST: "REPLACE_ME.neon.tech"          # DIRECT endpoint (nie -pooler)
  DB_POSTGRESQL_USER: "REPLACE_ME"
  DB_POSTGRESQL_PASSWORD: "REPLACE_ME"
  MONGODB_URI: "mongodb+srv://REPLACE_ME:REPLACE_ME@REPLACE_ME.mongodb.net/lingendo?retryWrites=true&w=majority"
  SPRING_DATA_REDIS_HOST: "REPLACE_ME"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_USERNAME: "default"
  SPRING_DATA_REDIS_PASSWORD: "REPLACE_ME"
  SPRING_DATA_REDIS_SSL: "false"
  OPENAI_API_KEY: "REPLACE_ME"
