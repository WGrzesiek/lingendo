# user-service — SZABLON deploymentu native dla pozostałych serwisów Java.
# Obraz: native (GraalVM native-image → debian:bookworm-slim). RAM cel ~128Mi, limit 256Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: lingendo
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: user-service
          # Zgodne z build-user-service.yml. Podmień wgrzesiek na właściciela repo (lowercase).
          image: ghcr.io/wgrzesiek/lingendo-user-service:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8812 }
            - { name: grpc, containerPort: 9098 }
          envFrom:
            - configMapRef: { name: lingendo-config }
          env:
            - { name: DATASOURCE_URL, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: DATASOURCE_URL } } }
            - { name: DB_POSTGRESQL_USER, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: DB_POSTGRESQL_USER } } }
            - { name: DB_POSTGRESQL_PASSWORD, valueFrom: { secretKeyRef: { name: lingendo-secrets, key: DB_POSTGRESQL_PASSWORD } } }
            - { name: KAFKA_GROUP, value: user-service-group }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: lingendo
spec:
  selector: { app: user-service }
  ports:
    - { name: http, port: 8812, targetPort: http }
    - { name: grpc, port: 9098, targetPort: grpc }
