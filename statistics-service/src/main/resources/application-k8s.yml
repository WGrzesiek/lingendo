# Profil k8s — deploy na k3s (native, low-RAM). Neon Postgres (schema `analytics`),
# Redpanda in-cluster, observability wypięta. Warstwa danych: JdbcTemplate + VIEWs (agregacja-on-read).
spring:
  config:
    activate:
      on-profile: k8s

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DB_POSTGRESQL_USER}
    password: ${DB_POSTGRESQL_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    default-schema: analytics
    schemas: analytics
    validate-on-migrate: true

  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:latest}
      group-id: ${KAFKA_GROUP:statistics-service-group}
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  port: ${SERVER_PORT:8799}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: false
