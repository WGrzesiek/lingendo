spring:
  application:
    name: statistics-service
  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3 # 3 razy proba wyslania zeby nie zabrazo sie zapentlac

    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
  datasource:
    url: jdbc:clickhouse://clickhouse:9001/learnwords
    username: wawrzen
    password: ubuntu98
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.ClickHouseDialect
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8799}


springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io:
      debezium: ${LOG_LEVEL_DEBEZIUM:INFO}
      debezium.connector.postgresql: ${LOG_LEVEL_DEBEZIUM_PG:INFO}
    org:
      apache:
        kafka: ${LOG_LEVEL_KAFKA:INFO}
      hibernate: ${LOG_LEVEL_HIBERNATE:INFO}
      postgresql: ${LOG_LEVEL_POSTGRESQL:INFO}
  logstash:
    host: ${LOGSTASH_HOST:logstash-1}
