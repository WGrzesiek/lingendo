spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${CLICKHOUSE_URL}
    username: ${CLICKHOUSE_USER}
    password: ${CLICKHOUSE_PASSWORD}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    validate-on-migrate: true

  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:latest}
      group-id: ${KAFKA_GROUP:statistics-service-group}
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

server:
  port: ${SERVER_PORT:8799}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.apache.kafka: ${LOG_LEVEL_KAFKA:WARN}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
  logstash:
    host: ${LOGSTASH_HOST}

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}
