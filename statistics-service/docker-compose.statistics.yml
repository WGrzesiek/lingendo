name: learnwords

services:
  statistics-service:
    image: ${IMAGE_NAME:-statistics-service}:${IMAGE_TAG:-dev}
    container_name: statistics-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${PORT:-8799}

      # ClickHouse
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-jdbc:clickhouse://clickhouse:8123/analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-wawrzen}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-Ubuntu98}

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_GROUP: ${KAFKA_GROUP:-statistics-service-group}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}

      # Observability
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
      TRACING_PROBABILITY: ${TRACING_PROBABILITY:-1.0}
      LOGSTASH_HOST: ${LOGSTASH_HOST:-logstash-1}

      # Log levels
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_KAFKA: ${LOG_LEVEL_KAFKA:-INFO}
      LOG_LEVEL_HIBERNATE: ${LOG_LEVEL_HIBERNATE:-INFO}
      LOG_LEVEL_DEBEZIUM: ${LOG_LEVEL_DEBEZIUM:-INFO}
      LOG_LEVEL_DEBEZIUM_PG: ${LOG_LEVEL_DEBEZIUM_PG:-INFO}

      JAVA_OPTS: ${JAVA_OPTS:-}

    ports:
      - "${PORT:-8799}:${PORT:-8799}"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://statistics-service:${PORT:-8799}/actuator/health/readiness | grep -q '\"status\"\\s*:\\s*\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

    networks:
      - learnwords-net

networks:
  learnwords-net:
    external: true
