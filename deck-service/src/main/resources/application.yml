spring:
  application:
    name: deck-service

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${DB_POSTGRESQL_HOST:192.168.23.9}:${DB_POSTGRESQL_PORT:5432}/${DB_POSTGRESQL_NAME:deck}
    username: ${DB_POSTGRESQL_USER:admin}
    password: ${DB_POSTGRESQL_PASSWORD:adminpassword}
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3 # 3 razy proba wyslania zeby nie zabrazo sie zapentlac

    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
server:
  port: ${SERVER_PORT:8814}
logging:
  logstash:
    host: ${LOGSTASH_HOST:localhost}
  level:
    org:
      apache:
        kafka: ${LOG_LEVEL_KAFKA:INFO}
      hibernate: ${LOG_LEVEL_HIBERNATE:INFO}
      postgresql: ${LOG_LEVEL_POSTGRESQL:INFO}

grpc:
  client:
    vocabulary-read:
      address: ${GRPC_VOCAB_READ_ADDRESS:static://192.168.23.9:9099} # np. static://vocabulary-read-service:0002
      negotiationType: ${GRPC_VOCAB_READ_NEGOTIATION:PLAINTEXT}
    auth:
      address: ${GRPC_CLIENT_AUTH_ADDRESS:static://192.168.23.9:9098}
      negotiationType: ${GRPC_CLIENT_AUTH_NEGOTIATIONTYPE:PLAINTEXT}
    user-relations:
      address: ${GRPC_USER_RELATIONS_ADDRESS:static://192.168.23.9:9098}
      negotiationType: ${GRPC_USER_RELATIONS_NEGOTIATION:PLAINTEXT}
    student-groups:
      address: ${GRPC_STUDENT_GROUPS_ADDRESS:static://192.168.23.9:9098}
      negotiationType: ${GRPC_STUDENT_GROUPS_NEGOTIATION:PLAINTEXT}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1
