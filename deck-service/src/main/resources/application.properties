spring.application.name=deck-service
server.port=8004

spring.datasource.url=jdbc:postgresql://localhost:5432/deck
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri = http://localhost:0003/.well-known/jwks.json
