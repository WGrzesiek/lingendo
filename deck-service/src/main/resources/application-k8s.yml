# Profil k8s — deploy na k3s (native, low-RAM). Neon Postgres, Redpanda in-cluster, observability wypięta.
spring:
  config:
    activate:
      on-profile: k8s

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DB_POSTGRESQL_USER}
    password: ${DB_POSTGRESQL_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        default_schema: decks

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    validate-on-migrate: true
    # Izolacja schematem w wspólnej bazie `lingendo` (unika kolizji flyway_schema_history).
    default-schema: decks
    schemas: decks

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:latest}
      group-id: ${KAFKA_GROUP:deck-service-group}
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

# gRPC clients in-cluster: PLAINTEXT (no TLS — native image has no netty-tcnative/BoringSSL,
# TLS would UnsatisfiedLinkError on OpenSsl). user-service hosts auth/user-relations/student-groups.
grpc:
  client:
    vocabulary-read:
      address: ${GRPC_VOCAB_READ_ADDRESS:static://vocabulary-read-service:9099}
      negotiationType: ${GRPC_VOCAB_READ_NEGOTIATION:PLAINTEXT}
    auth:
      address: ${GRPC_CLIENT_AUTH_ADDRESS:static://user-service:9098}
      negotiationType: ${GRPC_CLIENT_AUTH_NEGOTIATIONTYPE:PLAINTEXT}
    user-relations:
      address: ${GRPC_USER_RELATIONS_ADDRESS:static://user-service:9098}
      negotiationType: ${GRPC_USER_RELATIONS_NEGOTIATION:PLAINTEXT}
    student-groups:
      address: ${GRPC_STUDENT_GROUPS_ADDRESS:static://user-service:9098}
      negotiationType: ${GRPC_STUDENT_GROUPS_NEGOTIATION:PLAINTEXT}

server:
  port: ${SERVER_PORT:8814}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    enabled: false
