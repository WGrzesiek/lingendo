spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_POSTGRESQL_HOST}:${DB_POSTGRESQL_PORT:5432}/${DB_POSTGRESQL_NAME:koog}
    username: ${DB_POSTGRESQL_USER}
    password: ${DB_POSTGRESQL_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_GROUP:koog-service-group}

server:
  port: ${SERVER_PORT:7777}

management:
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.1}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

openai:
  api-key: ${OPENAI_API_KEY}

ai:
  sentence:
    model: ${AI_MODEL:gpt-5-mini}
    temperature: ${AI_TEMPERATURE:0.7}
    prompt-version: ${AI_PROMPT_VERSION:1}
    max-sentences-per-word: ${AI_MAX_SENTENCES:3}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.learnwords.koogservice: ${LOG_LEVEL_APP:INFO}
    org.springframework.kafka: ${LOG_LEVEL_KAFKA:INFO}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
    org.postgresql: ${LOG_LEVEL_POSTGRESQL:WARN}
    ai.koog: ${LOG_LEVEL_AI:INFO}
