name: learnwords

services:
  koog-service:
    image: ${IMAGE_NAME:-koog-service}:${IMAGE_TAG:-dev}
    container_name: koog-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${PORT:-7777}

      # DB
      DB_POSTGRESQL_HOST: ${DB_POSTGRESQL_HOST:-postgres}
      DB_POSTGRESQL_PORT: ${DB_POSTGRESQL_PORT:-5432}
      DB_POSTGRESQL_NAME: ${DB_POSTGRESQL_NAME:-koog}
      DB_POSTGRESQL_USER: ${DB_POSTGRESQL_USER:-admin}
      DB_POSTGRESQL_PASSWORD: ${DB_POSTGRESQL_PASSWORD:-adminpassword}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-30000}

      # Flyway
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_GROUP: ${KAFKA_GROUP:-koog-service-group}

      # OpenAI / AI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5-mini}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-1}
      AI_MAX_SENTENCES: ${AI_MAX_SENTENCES:-3}

      # Tracing
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://zipkin:9411/api/v2/spans}
      TRACING_PROBABILITY: ${TRACING_PROBABILITY:-1.0}

      # Swagger
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

      # Logging
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_KAFKA: ${LOG_LEVEL_KAFKA:-INFO}
      LOG_LEVEL_HIBERNATE: ${LOG_LEVEL_HIBERNATE:-INFO}
      LOG_LEVEL_POSTGRESQL: ${LOG_LEVEL_POSTGRESQL:-INFO}
      LOG_LEVEL_AI: ${LOG_LEVEL_AI:-INFO}
      LOGSTASH_HOST: ${LOGSTASH_HOST:-logstash}

      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}

    ports:
      - "${PORT:-7777}:${PORT:-7777}"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://koog-service:${PORT:-7777}/actuator/health/readiness | grep -q '\"status\"\\s*:\\s*\"UP\"'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s

    networks:
      - learnwords-net

networks:
  learnwords-net:
    external: true
